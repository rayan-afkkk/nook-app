name = "nook-worker"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Every 30 minutes: delete expired disappearing messages (and their Cloudinary media).
[triggers]
crons = ["*/30 * * * *"]

[vars]
# Not secret. Fill these in (see README → Cloudflare Worker).
FIREBASE_PROJECT_ID = ""
CLOUDINARY_CLOUD_NAME = ""

# Secrets — set with `npx wrangler secret put <NAME>` (never commit them):
#   FIREBASE_SERVICE_ACCOUNT   full JSON of a Firebase service-account key
#   CLOUDINARY_API_KEY
#   CLOUDINARY_API_SECRET
#   LIVEKIT_API_KEY
#   LIVEKIT_API_SECRET
